<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueTest — Live Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
  h1 { color: #00d4ff; margin-bottom: 10px; font-size: 1.4em; }
  .status { margin-bottom: 15px; font-size: 0.9em; }
  .status .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .dot.connected { background: #00ff88; }
  .dot.disconnected { background: #ff4444; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
  .panel { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: 12px; }
  .panel h2 { color: #00d4ff; font-size: 1em; margin-bottom: 8px; border-bottom: 1px solid #0f3460; padding-bottom: 4px; }
  .metric { display: flex; justify-content: space-between; padding: 3px 0; font-size: 0.85em; }
  .metric .label { color: #888; }
  .metric .value { color: #fff; font-weight: bold; }
  .metric .value.positive { color: #00ff88; }
  .metric .value.negative { color: #ff4444; }
  #fills { max-height: 250px; overflow-y: auto; }
  .fill-row { font-size: 0.8em; padding: 3px 0; border-bottom: 1px solid #0f3460; }
  .fill-row .buy { color: #00ff88; }
  .fill-row .sell { color: #ff4444; }
  #positions table { width: 100%; font-size: 0.85em; border-collapse: collapse; }
  #positions th { text-align: left; color: #888; padding: 3px 5px; }
  #positions td { padding: 3px 5px; }
  canvas { width: 100%; height: 200px; background: #0d1b2a; border-radius: 4px; }
</style>
</head>
<body>
<h1>TrueTest Live Dashboard</h1>
<div class="status">
  <span class="dot disconnected" id="statusDot"></span>
  <span id="statusText">Disconnected</span>
  <span style="margin-left: 20px; color: #888;" id="eventCount">Events: 0</span>
</div>

<div class="grid">
  <div class="panel">
    <h2>Portfolio</h2>
    <div id="portfolio">
      <div class="metric"><span class="label">Cash</span><span class="value" id="cash">—</span></div>
      <div class="metric"><span class="label">Total Trades</span><span class="value" id="trades">—</span></div>
    </div>
    <h2 style="margin-top: 10px;">Positions</h2>
    <div id="positions"><table><thead><tr><th>Symbol</th><th>Qty</th><th>Cost</th></tr></thead><tbody id="posBody"></tbody></table></div>
  </div>

  <div class="panel">
    <h2>Analytics</h2>
    <div id="analytics">
      <div class="metric"><span class="label">Equity</span><span class="value" id="equity">—</span></div>
      <div class="metric"><span class="label">Return</span><span class="value" id="cumReturn">—</span></div>
      <div class="metric"><span class="label">Sharpe</span><span class="value" id="sharpe">—</span></div>
      <div class="metric"><span class="label">Max DD</span><span class="value" id="maxDD">—</span></div>
      <div class="metric"><span class="label">Win Rate</span><span class="value" id="winRate">—</span></div>
      <div class="metric"><span class="label">Profit Factor</span><span class="value" id="profitFactor">—</span></div>
    </div>
  </div>
</div>

<div class="grid">
  <div class="panel">
    <h2>Equity Curve</h2>
    <canvas id="equityCanvas"></canvas>
  </div>

  <div class="panel">
    <h2>Recent Fills</h2>
    <div id="fills"></div>
  </div>
</div>

<script>
const WS_URL = 'ws://' + (location.hostname || 'localhost') + ':8765';
let ws = null;
let eventCount = 0;
let equityHistory = [];
const MAX_FILLS = 50;
const MAX_EQUITY = 500;

function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    document.getElementById('statusDot').className = 'dot connected';
    document.getElementById('statusText').textContent = 'Connected to ' + WS_URL;
  };

  ws.onclose = () => {
    document.getElementById('statusDot').className = 'dot disconnected';
    document.getElementById('statusText').textContent = 'Disconnected — reconnecting...';
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (e) => {
    eventCount++;
    document.getElementById('eventCount').textContent = 'Events: ' + eventCount;

    try {
      const msg = JSON.parse(e.data);
      handleMessage(msg);
    } catch (err) { /* ignore parse errors */ }
  };
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'fill':
      addFill(msg.data);
      break;
    case 'market':
      updateMarket(msg.data);
      break;
    case 'portfolio':
      updatePortfolio(msg.data);
      break;
    case 'analytics':
      updateAnalytics(msg.data);
      break;
  }
}

function addFill(d) {
  const fills = document.getElementById('fills');
  const cls = d.side === 'buy' ? 'buy' : 'sell';
  const row = document.createElement('div');
  row.className = 'fill-row';
  row.innerHTML = `<span class="${cls}">${d.side.toUpperCase()}</span> ${d.quantity} ${d.symbol} @ ${d.price.toFixed(2)} (fee: ${d.commission.toFixed(4)})`;
  fills.insertBefore(row, fills.firstChild);
  while (fills.children.length > MAX_FILLS) fills.removeChild(fills.lastChild);
}

function updateMarket(d) {
  equityHistory.push(d.close);
  if (equityHistory.length > MAX_EQUITY) equityHistory.shift();
  drawEquity();
}

function updatePortfolio(d) {
  document.getElementById('cash').textContent = d.cash.toFixed(2);
  document.getElementById('trades').textContent = d.total_trades;

  const body = document.getElementById('posBody');
  body.innerHTML = '';
  if (d.positions) {
    d.positions.forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${p.symbol}</td><td>${p.qty}</td><td>${p.cost_basis.toFixed(2)}</td>`;
      body.appendChild(tr);
    });
  }
}

function updateAnalytics(d) {
  document.getElementById('equity').textContent = d.final_equity.toFixed(2);
  const ret = document.getElementById('cumReturn');
  ret.textContent = (d.cumulative_return * 100).toFixed(3) + '%';
  ret.className = 'value ' + (d.cumulative_return >= 0 ? 'positive' : 'negative');
  document.getElementById('sharpe').textContent = d.sharpe_ratio.toFixed(3);
  const dd = document.getElementById('maxDD');
  dd.textContent = (d.max_drawdown * 100).toFixed(3) + '%';
  dd.className = 'value negative';
  document.getElementById('winRate').textContent = (d.win_rate * 100).toFixed(1) + '%';
  document.getElementById('profitFactor').textContent = d.profit_factor.toFixed(2);
}

function drawEquity() {
  const canvas = document.getElementById('equityCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  if (equityHistory.length < 2) return;

  const min = Math.min(...equityHistory);
  const max = Math.max(...equityHistory);
  const range = max - min || 1;
  const w = canvas.width;
  const h = canvas.height;
  const padding = 5;

  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#00d4ff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();

  for (let i = 0; i < equityHistory.length; i++) {
    const x = padding + (i / (equityHistory.length - 1)) * (w - 2 * padding);
    const y = h - padding - ((equityHistory[i] - min) / range) * (h - 2 * padding);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

connect();
</script>
</body>
</html>
